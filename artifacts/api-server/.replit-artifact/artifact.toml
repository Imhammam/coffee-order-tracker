kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/api/hubs/orders"]

[services.development]
run = "dotnet run --project dotnet/CoffeeOrderApi.csproj --no-launch-profile"

[services.production]

[services.production.build]
args = ["dotnet", "publish", "artifacts/api-server/dotnet/CoffeeOrderApi.csproj", "--configuration", "Release", "--output", "artifacts/api-server/dotnet/publish"]

[services.production.build.env]
ASPNETCORE_ENVIRONMENT = "Production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["dotnet", "artifacts/api-server/dotnet/publish/CoffeeOrderApi.dll"]

[services.production.run.env]
PORT = "8080"
ASPNETCORE_ENVIRONMENT = "Production"

[services.production.health.startup]
path = "/api/healthz"
